name: Generate Snake Animation

on:
  schedule:
    # Runs every day at midnight UTC
    - cron: "0 0 * * *"
  workflow_dispatch: # Allows manual trigger from the Actions tab

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Generate snake SVG for light and dark modes
        uses: Platane/snk@v3
        with:
          github_user_name: Hevin-CJ
          outputs: |
            github-contribution-grid-snake.svg
            github-contribution-grid-snake-dark.svg?palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_CONFIG_EMAIL: hevincjofficial@gmail.com

      - name: Push to output branch
        run: |
          git config --global user.email "hevincjofficial@gmail.com"
          git config --global user.name "Hevin-CJ"
          git clone --branch output https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/Hevin-CJ/Hevin-CJ.git output-branch
          cp github-contribution-grid-snake.svg output-branch/github-contribution-grid-snake.svg
          cp github-contribution-grid-snake-dark.svg output-branch/github-contribution-grid-snake-dark.svg
          cd output-branch
          git add github-contribution-grid-snake.svg github-contribution-grid-snake-dark.svg
          git diff --cached --quiet || git commit -m "chore: update light and dark snake animations"
          git push origin output
