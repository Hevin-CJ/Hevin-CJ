name: Generate Snake Animation

on:
  schedule:
    # Runs every day at midnight UTC
    - cron: "0 0 * * *"
  workflow_dispatch: # Allows manual trigger from the Actions tab

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Generate snake SVG for light and dark modes
        uses: Platane/snk@v3
        with:
          github_user_name: Hevin-CJ
          outputs: |
            github-contribution-grid-snake.svg?color_snake=#635BFF&color_dots=#ebedf0,#9be9a8,#40c463,#30a14e,#216e39
            github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#00F5D4&color_dots=#161b22,#0e4429,#006d32,#26a641,#39d353
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: .
          keep_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
